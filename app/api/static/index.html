<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The MarQ · Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ==================================================================
   The MarQ Communities — agent console

   Brand is fixed and comes first: Playfair Display and Montserrat, the
   ivory/black split, gold on rules and accents, burgundy on the one
   action. Glass fills gaps; it never replaces a brand decision.

   Glass has a job here rather than a look. The header and composer are
   frosted because content scrolls *beneath* them and legibility over
   moving text is the whole reason the technique exists. Cards are
   translucent so the page reads as layered rather than boxed. Answer text
   sits on the bare ground, where contrast is highest — body copy never
   rides a heavily transparent surface.

   Glass also needs something worth blurring: two very low-opacity washes
   sit under everything so the frost has colour to refract. On a flat
   ground backdrop-filter is invisible.
   ================================================================== */
:root {
  --black: #0D0D0D;
  --ivory: #F5F3EF;
  --burgundy: #5B0F1A;
  --gold: #CBA46E;
  --charcoal: #2A2A2A;

  /* Neutrals biased warm toward the gold — a pure grey reads unconsidered
     beside this palette. */
  --ink: #1B1A18;
  --ink-dim: #726B61;
  --rule: rgba(27, 26, 24, .11);
  --rule-strong: rgba(27, 26, 24, .18);

  --gold-soft: rgba(203, 164, 110, .34);
  --gold-faint: rgba(203, 164, 110, .13);

  --glass: rgba(255, 255, 255, .66);
  --glass-strong: rgba(255, 255, 255, .82);
  --glass-dark: rgba(13, 13, 13, .84);
  --blur: blur(18px) saturate(1.5);

  --lift: 0 1px 2px rgba(27,26,24,.04), 0 8px 28px -12px rgba(27,26,24,.16);
  --lift-lg: 0 2px 4px rgba(27,26,24,.05), 0 18px 48px -20px rgba(27,26,24,.24);

  --display: "Playfair Display", Georgia, "Times New Roman", serif;
  --body: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;

  --header-h: 62px;
  /* [claude] The composer is absolutely positioned so content scrolls
     beneath its frosted bar; the log needs matching bottom room or the
     last lines hide behind it. Measured, not guessed: 109px at rest, plus
     air, plus what the textarea can grow by. */
  --composer-h: 132px;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

body {
  background: var(--ivory);
  color: var(--ink);
  font-family: var(--body);
  font-size: 14px; line-height: 1.65; font-weight: 400;
  display: grid; grid-template-columns: 296px 1fr;
  height: 100vh; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* The ambient ground. Fixed, behind everything, giving the glass colour
   to refract — without it backdrop-filter has no visible effect. */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(58vw 46vh at 12% -6%, rgba(203,164,110,.22), transparent 62%),
    radial-gradient(52vw 52vh at 104% 108%, rgba(91,15,26,.13), transparent 60%),
    radial-gradient(42vw 34vh at 78% 8%, rgba(203,164,110,.09), transparent 66%);
}
aside, main { position: relative; z-index: 1; }
::selection { background: var(--gold-soft); }

:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
  border-radius: 2px;
}

.label {
  font-size: 10px; font-weight: 500; letter-spacing: .22em;
  text-transform: uppercase; color: var(--ink-dim);
}

/* ==================================================================
   Sidebar — deep glass over the wash
   ================================================================== */
aside {
  background: var(--glass-dark);
  color: var(--ivory);
  display: flex; flex-direction: column; min-width: 0;
  border-right: 1px solid rgba(203,164,110,.16);
}
@supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
  aside { background: rgba(13,13,13,.72);
          -webkit-backdrop-filter: blur(26px) saturate(1.3);
          backdrop-filter: blur(26px) saturate(1.3); }
}

.brand { padding: 30px 26px 20px; text-align: center; }
.brand .the {
  font-size: 9px; letter-spacing: .42em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 6px;
}
.brand .wordmark {
  font-family: var(--display); font-size: 30px; letter-spacing: .1em;
  line-height: 1; color: var(--ivory); margin-bottom: 8px;
}
.brand .sub {
  font-size: 8px; letter-spacing: .38em; text-transform: uppercase;
  color: rgba(245,243,239,.55);
}
.rule-gold {
  height: 1px; margin: 16px 26px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.tagline {
  text-align: center; font-size: 8px; letter-spacing: .34em;
  text-transform: uppercase; color: var(--gold); padding-bottom: 4px;
}

.panel { padding: 18px 26px; }
.panel + .panel { border-top: 1px solid rgba(245,243,239,.08); }
.panel .label { color: rgba(245,243,239,.42); margin-bottom: 10px; display: block; }

input, textarea, button, select { font-family: var(--body); font-size: 13px; color: inherit; }

aside input[type=password], aside input[type=text] {
  width: 100%; background: rgba(245,243,239,.06); color: var(--ivory);
  border: 1px solid rgba(245,243,239,.14); border-radius: 3px;
  padding: 9px 11px; letter-spacing: .02em; transition: all .18s ease;
}
aside input:focus {
  outline: none; border-color: var(--gold);
  background: rgba(203,164,110,.09);
  box-shadow: 0 0 0 3px rgba(203,164,110,.12);
}
.mono { font-family: var(--mono); font-size: 10.5px; }
.hint-dark { color: rgba(245,243,239,.4); margin-top: 8px; }

.drop {
  border: 1px dashed rgba(203,164,110,.4); border-radius: 3px;
  padding: 16px 12px; text-align: center; cursor: pointer;
  transition: all .2s ease; color: rgba(245,243,239,.6);
  font-size: 11px; letter-spacing: .06em;
  background: rgba(245,243,239,.02);
}
.drop:hover, .drop.over {
  border-color: var(--gold); background: rgba(203,164,110,.1);
  color: var(--gold); transform: translateY(-1px);
}
.drop svg { display: block; margin: 0 auto 8px; opacity: .8; }

.file-row {
  display: flex; align-items: center; gap: 8px; padding: 8px 0;
  border-bottom: 1px solid rgba(245,243,239,.07); font-size: 11.5px;
}
.file-row .fn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-row .meta { color: rgba(245,243,239,.4); font-size: 10px; letter-spacing: .04em; }
.kill { cursor: pointer; color: rgba(245,243,239,.32); padding: 0 3px; line-height: 1;
        transition: color .16s ease; }
.kill:hover { color: var(--gold); }

.threads { flex: 1; overflow-y: auto; padding: 4px 14px 18px; min-height: 0; }
.threads::-webkit-scrollbar, .log::-webkit-scrollbar { width: 7px; }
.threads::-webkit-scrollbar-thumb { background: rgba(245,243,239,.13); border-radius: 4px; }
.log::-webkit-scrollbar-thumb { background: rgba(27,26,24,.14); border-radius: 4px; }
.thread {
  padding: 9px 12px; cursor: pointer; display: flex; gap: 8px; align-items: baseline;
  border-left: 2px solid transparent; border-radius: 0 3px 3px 0;
  transition: all .16s ease;
}
.thread:hover { background: rgba(245,243,239,.05); }
.thread.active { border-left-color: var(--gold); background: rgba(203,164,110,.11); }
.thread .t {
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 12.5px; color: rgba(245,243,239,.86);
}
.thread.active .t { color: var(--ivory); }
.thread .n { font-size: 9.5px; color: rgba(245,243,239,.34); letter-spacing: .08em;
             font-variant-numeric: tabular-nums; }

.btn-row { display: flex; gap: 8px; }
.btn {
  flex: 1; cursor: pointer; border-radius: 3px; padding: 9px 10px;
  font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; font-weight: 500;
  background: transparent; color: var(--gold);
  border: 1px solid rgba(203,164,110,.38); transition: all .2s ease;
}
.btn:hover:not(:disabled) { background: var(--gold); color: var(--black); border-color: var(--gold); }
.btn:disabled { opacity: .35; cursor: not-allowed; }

/* ==================================================================
   Main — frosted chrome, content scrolling beneath
   ================================================================== */
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

header.bar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 6;
  height: var(--header-h); padding: 0 40px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--glass); border-bottom: 1px solid var(--rule);
}
header.bar .title { font-family: var(--display); font-size: 17px; letter-spacing: .04em; }

.status {
  display: flex; align-items: center; gap: 8px; cursor: default;
  padding: 5px 12px; border-radius: 20px;
  background: var(--glass-strong); border: 1px solid var(--rule);
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-dim); flex: none; }
.dot.ok { background: #2F7D5B; box-shadow: 0 0 0 3px rgba(47,125,91,.16); }
.dot.bad { background: var(--burgundy); box-shadow: 0 0 0 3px rgba(91,15,26,.14); }

.log { flex: 1; overflow-y: auto;
       padding: calc(var(--header-h) + 34px) 40px var(--composer-h); }
.wrap { max-width: 720px; margin: 0 auto; }

.composer {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 6;
  border-top: 1px solid var(--rule); padding: 16px 40px 18px;
  background: var(--glass);
}
@supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
  header.bar, .composer {
    background: rgba(245,243,239,.62);
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  }
  .status { background: rgba(255,255,255,.5);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
}
.composer .wrap { display: flex; gap: 12px; align-items: flex-end; }
textarea {
  flex: 1; resize: none; max-height: 170px;
  background: var(--glass-strong); border: 1px solid var(--rule-strong);
  padding: 12px 15px; font-size: 14px; line-height: 1.6; border-radius: 3px;
  transition: all .18s ease;
}
textarea:focus {
  outline: none; border-color: var(--gold); background: #fff;
  box-shadow: 0 0 0 3px rgba(203,164,110,.16);
}
.send {
  flex: none; width: 112px; padding: 12px 0; cursor: pointer; border: none;
  background: var(--burgundy); color: var(--gold); border-radius: 3px;
  font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; font-weight: 600;
  transition: all .2s ease; box-shadow: var(--lift);
}
.send:hover:not(:disabled) { background: var(--black); transform: translateY(-1px);
                             box-shadow: var(--lift-lg); }
.send:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
.foot { text-align: center; margin-top: 9px; font-size: 10px;
        color: var(--ink-dim); letter-spacing: .06em; }

/* ==================================================================
   Conversation
   ================================================================== */
.msg { margin-bottom: 32px; animation: msgIn .34s cubic-bezier(.22,.8,.3,1) both; }
@keyframes msgIn { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

.who { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.who .name {
  font-size: 9.5px; letter-spacing: .24em; text-transform: uppercase;
  color: var(--ink-dim); font-weight: 500;
}
.msg.user .bubble {
  background: var(--glass-strong); border: 1px solid var(--rule);
  border-left: 2px solid var(--gold); border-radius: 0 3px 3px 0;
  padding: 14px 18px; white-space: pre-wrap; word-wrap: break-word;
  box-shadow: var(--lift);
}
@supports (backdrop-filter: blur(1px)) {
  .msg.user .bubble { background: rgba(255,255,255,.6);
                      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
}
/* Answer text sits on the ground, not on glass — highest contrast where
   the most reading happens. */
.msg.agent .bubble {
  white-space: normal; word-wrap: break-word;
  font-size: 14.5px; line-height: 1.82; color: #23211E;
}
.msg.agent .bubble p { margin: 0 0 10px; }
.msg.agent .bubble p:last-child { margin-bottom: 0; }
.msg.agent .bubble strong { font-weight: 600; color: var(--black); }
.msg.agent .bubble em { font-style: italic; color: var(--charcoal); }
.msg.agent .bubble code {
  font-family: var(--mono); font-size: 12.5px; background: var(--gold-faint);
  border: 1px solid var(--gold-soft); padding: 1px 5px; border-radius: 3px;
}
.msg.agent .bubble h4 {
  font-family: var(--display); font-size: 15px; font-weight: 500;
  letter-spacing: .03em; margin: 16px 0 8px; text-wrap: balance;
}
.msg.agent .bubble ul { margin: 4px 0 12px; padding-left: 0; list-style: none; }
.msg.agent .bubble li { position: relative; padding-left: 20px; margin-bottom: 5px; }
.msg.agent .bubble li::before {
  content: "◇"; position: absolute; left: 2px; top: 0;
  color: var(--gold); font-size: 10px; line-height: 1.9;
}

/* while the agent works */
.stage {
  display: flex; align-items: center; gap: 10px; padding: 2px 0 6px;
  font-size: 11.5px; letter-spacing: .1em; color: var(--ink-dim);
}
.stage .orb { width: 8px; height: 8px; flex: none; position: relative; }
.stage .orb::before, .stage .orb::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--gold);
}
.stage .orb::after { animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(1); opacity: .65 } 100% { transform: scale(2.8); opacity: 0 } }
.stage .elapsed { margin-left: auto; opacity: .45; font-size: 10.5px;
                  font-variant-numeric: tabular-nums; }
.stage.gone { display: none; }

.caret {
  display: inline-block; width: 2px; height: 1.05em; background: var(--gold);
  vertical-align: -.16em; margin-left: 1px; animation: blink 1.05s steps(2) infinite;
}
@keyframes blink { 0%,50% { opacity: 1 } 50.1%,100% { opacity: 0 } }

/* ==================================================================
   After the answer — copy, and the machinery behind a control
   ================================================================== */
.after { display: flex; align-items: center; gap: 16px; margin-top: 12px;
         opacity: 0; animation: rise .32s ease forwards; }
@keyframes rise { to { opacity: 1 } }
.after button {
  background: none; border: none; padding: 0; cursor: pointer;
  font-family: var(--body); font-size: 10px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-dim);
  display: flex; align-items: center; gap: 6px; transition: color .16s ease;
}
.after button:hover { color: var(--burgundy); }
.after .gem { color: var(--gold); font-size: 9px; transition: transform .22s ease; }
.after button.open .gem { transform: rotate(90deg); }

.details { margin-top: 12px; border-left: 2px solid var(--gold-soft);
           padding-left: 16px; display: none; }
.details.open { display: block; animation: rise .26s ease forwards; }
.details .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.details .cap { font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase;
                color: var(--ink-dim); margin-right: 4px; }

.pill {
  font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase;
  padding: 3px 10px; border: 1px solid var(--rule); color: var(--ink-dim);
  border-radius: 20px; background: var(--glass-strong);
}
.pill.who { color: var(--burgundy); border-color: rgba(91,15,26,.24); }
.pill.tool { color: #8A6D3F; border-color: var(--gold-soft); background: var(--gold-faint); }

.q { margin-bottom: 14px; }
.q .qh { font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase;
         color: var(--ink-dim); margin-bottom: 6px; }
.q pre {
  margin: 0; padding: 14px 16px; background: var(--black); color: #D9D4C9;
  overflow-x: auto; border-radius: 3px; box-shadow: var(--lift);
  font: 11.5px/1.7 var(--mono);
}
.q pre .kw { color: var(--gold); }
.q .meta { margin-top: 5px; font-size: 10.5px; color: var(--ink-dim); letter-spacing: .04em; }
.q .meta.warn { color: var(--burgundy); }
.q .declined { padding: 10px 14px; background: var(--glass-strong);
               border: 1px solid var(--rule); font-size: 12.5px; color: var(--ink-dim); }

.err {
  border: 1px solid rgba(91,15,26,.28); border-left: 2px solid var(--burgundy);
  background: rgba(91,15,26,.05); padding: 13px 17px; color: var(--burgundy);
  border-radius: 0 3px 3px 0;
}

/* ==================================================================
   Empty state
   ================================================================== */
.empty { text-align: center; padding-top: 6vh; }
.empty .mark { margin: 0 auto 26px; display: block; }
.empty .big {
  font-family: var(--display); font-size: 28px; letter-spacing: .05em;
  color: var(--ink); margin-bottom: 12px; text-wrap: balance;
}
.empty .lead {
  font-size: 9px; letter-spacing: .38em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 30px;
}
.suggest { display: grid; gap: 9px; max-width: 440px; margin: 0 auto; }
.suggest button {
  background: var(--glass); border: 1px solid var(--rule); padding: 13px 17px;
  cursor: pointer; text-align: left; font-size: 13px; color: var(--ink);
  border-radius: 3px; transition: all .2s ease; box-shadow: var(--lift);
}
.suggest button:hover {
  border-color: var(--gold-soft); background: var(--glass-strong);
  transform: translateY(-2px); box-shadow: var(--lift-lg);
}
@supports (backdrop-filter: blur(1px)) {
  .suggest button { -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
}

/* ==================================================================
   Charts

   Palette computed, not chosen: the raw brand colours fail the lightness
   band, the chroma floor and 3:1 contrast. These are brand-faithful steps
   that pass all five checks on both surfaces.
   ================================================================== */
.chart {
  margin: 18px 0 6px; background: var(--glass-strong);
  border: 1px solid var(--rule); border-radius: 4px;
  padding: 20px 20px 14px; box-shadow: var(--lift);
}
@supports (backdrop-filter: blur(1px)) {
  .chart { background: rgba(255,255,255,.72);
           -webkit-backdrop-filter: blur(14px) saturate(1.3);
           backdrop-filter: blur(14px) saturate(1.3); }
}
.chart h5 { margin: 0 0 2px; font-family: var(--display); font-size: 15.5px;
            font-weight: 500; letter-spacing: .02em; color: var(--ink); }
.chart .sub { font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
              color: var(--ink-dim); margin-bottom: 14px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .axis { stroke: var(--rule-strong); stroke-width: 1; }
.chart .tick { fill: var(--ink-dim); font-size: 10px; letter-spacing: .04em;
               font-variant-numeric: tabular-nums; }
.chart .cat { fill: var(--ink-dim); font-size: 10.5px; }
.chart .val { fill: var(--ink); font-size: 10.5px; font-weight: 500;
              font-variant-numeric: tabular-nums; }
.chart .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
.chart .legend span { display: flex; align-items: center; gap: 7px;
                      font-size: 10.5px; color: var(--ink-dim); }
.chart .legend i { width: 10px; height: 10px; border-radius: 2px; display: block; }
.chart .foot { display: flex; justify-content: flex-end; margin-top: 10px; }
.chart .foot button {
  background: none; border: none; cursor: pointer; padding: 0;
  font-family: var(--body); font-size: 9.5px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-dim); transition: color .16s ease;
}
.chart .foot button:hover { color: var(--burgundy); }
.chart table { width: 100%; border-collapse: collapse; margin-top: 10px; display: none; }
.chart table.open { display: table; }
.chart th, .chart td { text-align: left; padding: 6px 8px;
  border-bottom: 1px solid var(--rule); font-size: 11.5px; }
.chart th { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
            color: var(--ink-dim); font-weight: 500; }
.chart td.n { text-align: right; font-variant-numeric: tabular-nums; }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .rel { position: relative; }
.chart .tip {
  position: absolute; pointer-events: none; background: rgba(13,13,13,.92);
  color: var(--ivory); padding: 7px 11px; font-size: 11.5px; border-radius: 3px;
  white-space: nowrap; opacity: 0; transition: opacity .12s ease; z-index: 30;
  border-left: 2px solid var(--gold); transform: translate(-50%, -120%);
  box-shadow: var(--lift-lg);
}
@supports (backdrop-filter: blur(1px)) {
  .chart .tip { -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
}
.chart .tip.show { opacity: 1; }

/* ==================================================================
   Toast
   ================================================================== */
.toast {
  position: fixed; bottom: 26px; left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: rgba(13,13,13,.9); color: var(--ivory); padding: 13px 20px;
  font-size: 12.5px; border-radius: 3px; z-index: 50; opacity: 0;
  transition: all .3s cubic-bezier(.22,.8,.3,1); max-width: 520px;
  pointer-events: none; border-left: 2px solid var(--gold);
  box-shadow: var(--lift-lg);
}
@supports (backdrop-filter: blur(1px)) {
  .toast { -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.bad { border-left-color: var(--burgundy); }

.spin { display: inline-block; animation: sp 1.1s linear infinite; color: var(--gold); }
@keyframes sp { to { transform: rotate(360deg); } }

/* ==================================================================
   Motion and small screens
   ================================================================== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important; animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
  .msg { animation: none; }
  .suggest button:hover, .send:hover:not(:disabled), .drop:hover { transform: none; }
}

@media (max-width: 900px) {
  body { grid-template-columns: 1fr; }
  aside { display: none; }
  .log { padding-left: 20px; padding-right: 20px; }

<script>
const $ = (id) => document.getElementById(id);
let threadId = null, busy = false;

const SUGGESTIONS = [
  "How many deals are there in total?",
  "Which franchise has the highest cancellation rate?",
  "Among qualified leads, how many have gone stale?",
  "What is the total unit area across all contracted deals?",
];

/* ---------------- token ---------------- */
$("token").value = localStorage.getItem("marq_token") || "";
$("token").addEventListener("change", () => {
  localStorage.setItem("marq_token", $("token").value.trim());
  refreshAll();
});
const auth = () => {
  const t = $("token").value.trim();
  return t ? { Authorization: "Bearer " + t } : {};
};
const hasToken = () => !!$("token").value.trim();

/* ---------------- rendering ---------------- */
function bubble(role, text) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = `<div class="who"><span class="name">${role === "user" ? "You" : "The MarQ"}</span></div>
                  <div class="bubble"></div>`;
  const b = el.querySelector(".bubble");
  if (role === "agent" && text) b.innerHTML = renderMarkdown(text);
  else b.textContent = text || "";
  $("log").querySelector(".wrap").appendChild(el);
  scrollDown();
  return el;
}
const scrollDown = () => { $("log").scrollTop = $("log").scrollHeight; };

/* ------------------------------------------------------------------
   Everything technical, revealed only after the answer settles.

   Nothing about tools, routes or SQL appears while the answer streams. It
   is how the machine works, not what was asked, and a conversation that
   narrates its own plumbing reads as a console rather than an assistant.

   It is not discarded though: the provenance feature exists so a number can
   be checked rather than trusted, and that only works if the query stays
   reachable. So it moves here — one quiet control under the finished
   answer, closed by default.
   ------------------------------------------------------------------ */
const SPECIALIST_NAMES = {
  deals: "Deals", leads: "Leads", workspace: "Your files",
  research: "Web research", general: "General",
};
const labelFor = (r) => SPECIALIST_NAMES[r] || r;

function pill(text, cls) {
  const s = document.createElement("span");
  s.className = "pill " + cls;
  s.textContent = text;
  return s;
}

function attachDetails(el, { specialists, tools, provenance, answer, charts }) {
  // Charts sit with the answer, above the technical detail: they are part
  // of what was said, not part of how it was worked out.
  (charts || []).forEach(spec => {
    try { el.appendChild(renderChart(spec)); }
    catch (e) { console.warn("chart failed to render", e); }
  });

  const bar = document.createElement("div");
  bar.className = "after";

  const copy = document.createElement("button");
  const setCopy = (t) => (copy.innerHTML = `<span class="gem">◇</span> ${t}`);
  setCopy("Copy");
  copy.onclick = async () => {
    try {
      await navigator.clipboard.writeText(answer || "");
      setCopy("Copied");
      setTimeout(() => setCopy("Copy"), 1600);
    } catch { toast("Could not copy to the clipboard", true); }
  };
  bar.appendChild(copy);

  const rows = [];
  if (specialists && specialists.length) rows.push(["Answered by", specialists.map(labelFor), "who"]);
  if (tools && tools.length) rows.push(["Steps", tools.map(t => t.replace(/_/g, " ")), "tool"]);

  let panel = null;

  if (rows.length || (provenance && provenance.length)) {
    panel = document.createElement("div");
    panel.className = "details";

    rows.forEach(([cap, items, cls]) => {
      const row = document.createElement("div");
      row.className = "row";
      const c = document.createElement("span");
      c.className = "cap"; c.textContent = cap;
      row.appendChild(c);
      items.forEach(t => row.appendChild(pill(t, cls)));
      panel.appendChild(row);
    });

    (provenance || []).forEach((rec, i) => {
      const q = document.createElement("div");
      q.className = "q";
      const head = document.createElement("div");
      head.className = "qh";
      head.textContent = rec.sql
        ? (provenance.length > 1 ? `Query ${i + 1}` : "The query")
        : "No query ran";
      q.appendChild(head);

      if (rec.sql) {
        const pre = document.createElement("pre");
        pre.innerHTML = sqlHtml(rec.sql);
        q.appendChild(pre);
        const m = document.createElement("div");
        m.className = "meta" + (rec.truncated ? " warn" : "");
        m.textContent = (rec.rows_available ?? "?") + " row(s) matched"
          + (rec.truncated ? " · truncated — a total from this would be wrong" : "");
        q.appendChild(m);
      } else if (rec.refused) {
        const d = document.createElement("div");
        d.className = "declined"; d.textContent = rec.refused;
        q.appendChild(d);
      }
      panel.appendChild(q);
    });

    const toggle = document.createElement("button");
    const setToggle = () => (toggle.innerHTML = '<span class="gem">▸</span> Details');
    setToggle();
    toggle.onclick = () => {
      const open = panel.classList.toggle("open");
      toggle.classList.toggle("open", open);
      if (open) scrollDown();
    };
    bar.appendChild(toggle);
  }

  el.appendChild(bar);
  if (panel) el.appendChild(panel);
  scrollDown();
}

/* ------------------------------------------------------------------
   Chart rendering.

   Built to fixed mark specs rather than taste: bars capped at 24px with a
   4px rounded data-end square at the baseline, 2px lines, 8px markers, a
   2px surface gap between touching marks, hairline solid axes one step off
   the surface, and text in ink tokens — never in the series colour, which
   is illegible as type.

   Labels are selective: a value rides each bar because there are few of
   them, but a line labels only its endpoint. Every value is in the table
   view regardless, so nothing is readable only as a length.
   ------------------------------------------------------------------ */
const CHART_COLORS = ["#A82F48", "#9E7410", "#00795F", "#4A4FA8"];
const SURFACE = "#ffffff";

// [claude] toLocaleString with a max, not toFixed: toFixed(2) rendered
// 34.6 as "34.60" and 13 as "13.00", which reads as false precision — a
// rate quoted to two decimals it does not have.
const fmtNum = (n) =>
  Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });
const fmtVal = (n, suffix) => fmtNum(n) + (suffix || "");

function svgEl(name, attrs = {}) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

/* A rounded-at-one-end bar: square on the baseline, 4px round at the tip. */
function barPath(x, y, w, h, r, vertical) {
  const rr = Math.max(0, Math.min(r, vertical ? h : w));
  if (vertical) {
    return `M${x},${y + h} L${x},${y + rr} Q${x},${y} ${x + rr},${y}` +
           ` L${x + w - rr},${y} Q${x + w},${y} ${x + w},${y + rr}` +
           ` L${x + w},${y + h} Z`;
  }
  return `M${x},${y} L${x + w - rr},${y} Q${x + w},${y} ${x + w},${y + rr}` +
         ` L${x + w},${y + h - rr} Q${x + w},${y + h} ${x + w - rr},${y + h}` +
         ` L${x},${y + h} Z`;
}

function niceMax(v) {
  if (v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  return Math.ceil(v / mag * 2) / 2 * mag;
}

function renderChart(spec) {
  const box = document.createElement("div");
  box.className = "chart";

  const h = document.createElement("h5");
  h.textContent = spec.title;
  box.appendChild(h);

  const sub = document.createElement("div");
  sub.className = "sub";
  sub.textContent = spec.series.map(s => s.name).join(" · ");
  box.appendChild(sub);

  const rel = document.createElement("div");
  rel.className = "rel";
  box.appendChild(rel);

  const tip = document.createElement("div");
  tip.className = "tip";
  rel.appendChild(tip);

  const showTip = (evt, text) => {
    tip.textContent = text;
    const r = rel.getBoundingClientRect();
    tip.style.left = (evt.clientX - r.left) + "px";
    tip.style.top = (evt.clientY - r.top) + "px";
    tip.classList.add("show");
  };
  const hideTip = () => tip.classList.remove("show");

  const svg = spec.kind === "donut" ? donutSvg(spec, showTip, hideTip)
            : spec.kind === "line"  ? lineSvg(spec, showTip, hideTip)
            : spec.kind === "bar"   ? barSvg(spec, showTip, hideTip)
            :                         columnSvg(spec, showTip, hideTip);
  rel.appendChild(svg);

  // Legend for two or more series; one series needs none — the title says it.
  if (spec.series.length > 1) {
    const leg = document.createElement("div");
    leg.className = "legend";
    spec.series.forEach((se, i) => {
      const item = document.createElement("span");
      const swatch = document.createElement("i");
      swatch.style.background = CHART_COLORS[i % CHART_COLORS.length];
      item.appendChild(swatch);
      item.appendChild(document.createTextNode(se.name));
      leg.appendChild(item);
    });
    box.appendChild(leg);
  }

  // Table view — the accessibility floor, and how a number gets checked.
  const table = document.createElement("table");
  const head = document.createElement("tr");
  head.innerHTML = "<th>Category</th>" +
    spec.series.map(se => `<th class="n" style="text-align:right">${se.name}</th>`).join("");
  table.appendChild(head);
  spec.labels.forEach((label, i) => {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.textContent = label;
    tr.appendChild(td);
    spec.series.forEach(se => {
      const cell = document.createElement("td");
      cell.className = "n";
      cell.textContent = fmtVal(se.values[i], spec.value_suffix);
      tr.appendChild(cell);
    });
    table.appendChild(tr);
  });

  const foot = document.createElement("div");
  foot.className = "foot";
  const toggle = document.createElement("button");
  toggle.textContent = "Show values";
  toggle.onclick = () => {
    const open = table.classList.toggle("open");
    toggle.textContent = open ? "Hide values" : "Show values";
  };
  foot.appendChild(toggle);
  box.appendChild(foot);
  box.appendChild(table);

  return box;
}

/* ---- horizontal bars: best when category names are long ---- */
function barSvg(spec, showTip, hideTip) {
  const n = spec.labels.length, series = spec.series;
  const rowH = 30, gap = 2, padL = 128, padR = 62, padT = 6;
  const height = n * rowH + padT + 8;
  const width = 640;
  const plotW = width - padL - padR;
  const max = niceMax(Math.max(...series.flatMap(s => s.values.map(Math.abs)), 0));
  const svg = svgEl("svg", { viewBox: `0 0 ${width} ${height}`, role: "img" });

  svg.appendChild(svgEl("line", {
    x1: padL, y1: padT, x2: padL, y2: height - 8, class: "axis",
  }));

  spec.labels.forEach((label, i) => {
    const top = padT + i * rowH;
    const t = svgEl("text", { x: padL - 10, y: top + rowH / 2 + 3,
                              "text-anchor": "end", class: "cat" });
    t.textContent = label.length > 20 ? label.slice(0, 19) + "…" : label;
    svg.appendChild(t);

    const band = rowH - 8;
    const thick = Math.min(24, (band - (series.length - 1) * gap) / series.length);

    series.forEach((se, k) => {
      const v = se.values[i];
      const w = Math.max(1, (Math.abs(v) / max) * plotW);
      const y = top + (rowH - (thick * series.length + gap * (series.length - 1))) / 2
                + k * (thick + gap);
      const path = svgEl("path", {
        d: barPath(padL, y, w, thick, 4, false),
        fill: CHART_COLORS[k % CHART_COLORS.length],
      });
      svg.appendChild(path);

      if (series.length === 1 && n <= 10) {
        const lab = svgEl("text", { x: padL + w + 8, y: y + thick / 2 + 3.5, class: "val" });
        lab.textContent = fmtVal(v, spec.value_suffix);
        svg.appendChild(lab);
      }

      const hit = svgEl("rect", { x: padL, y, width: Math.max(w, 8), height: thick, class: "hit" });
      hit.addEventListener("mousemove", e =>
        showTip(e, `${label} · ${se.name} ${fmtVal(v, spec.value_suffix)}`));
      hit.addEventListener("mouseleave", hideTip);
      svg.appendChild(hit);
    });
  });

  return svg;
}

/* ---- vertical columns: time, or few categories ---- */
function columnSvg(spec, showTip, hideTip) {
  const n = spec.labels.length, series = spec.series;
  // [claude] The band is capped as well as the bar. Bars cap at 24px, and
  // with four categories across a 640-wide plot that leaves 160px bands —
  // technically correct and visually sparse, the marks lost in their own
  // whitespace. Capping the band keeps the air proportionate.
  const BAND_MAX = 92;
  const padL = 46, padR = 14, padT = 22, padB = 40;
  const width = Math.min(640, padL + padR + n * BAND_MAX);
  const height = 260;
  const plotW = width - padL - padR, plotH = height - padT - padB;
  const max = niceMax(Math.max(...series.flatMap(s => s.values.map(Math.abs)), 0));
  const svg = svgEl("svg", { viewBox: `0 0 ${width} ${height}`, role: "img" });

  [0, 0.5, 1].forEach(f => {
    const y = padT + plotH - f * plotH;
    svg.appendChild(svgEl("line", { x1: padL, y1: y, x2: width - padR, y2: y, class: "axis" }));
    const t = svgEl("text", { x: padL - 8, y: y + 3.5, "text-anchor": "end", class: "tick" });
    t.textContent = fmtNum(max * f);
    svg.appendChild(t);
  });

  const band = plotW / n, gap = 2;
  spec.labels.forEach((label, i) => {
    const thick = Math.min(24, (band * 0.62 - (series.length - 1) * gap) / series.length);
    const groupW = thick * series.length + gap * (series.length - 1);
    const x0 = padL + band * i + (band - groupW) / 2;

    series.forEach((se, k) => {
      const v = se.values[i];
      const bh = Math.max(1, (Math.abs(v) / max) * plotH);
      const x = x0 + k * (thick + gap);
      const y = padT + plotH - bh;
      svg.appendChild(svgEl("path", {
        d: barPath(x, y, thick, bh, 4, true),
        fill: CHART_COLORS[k % CHART_COLORS.length],
      }));

      // Selective labelling: past eight categories the values crowd each
      // other and the axis plus the tooltip carry them instead.
      if (series.length === 1 && n <= 8) {
        const lab = svgEl("text", { x: x + thick / 2, y: y - 7,
                                    "text-anchor": "middle", class: "val" });
        lab.textContent = fmtVal(v, spec.value_suffix);
        svg.appendChild(lab);
      }

      const hit = svgEl("rect", { x, y: padT, width: thick, height: plotH, class: "hit" });
      hit.addEventListener("mousemove", e =>
        showTip(e, `${label} · ${se.name} ${fmtVal(v, spec.value_suffix)}`));
      hit.addEventListener("mouseleave", hideTip);
      svg.appendChild(hit);
    });

    const t = svgEl("text", { x: padL + band * i + band / 2, y: height - padB + 18,
                              "text-anchor": "middle", class: "cat" });
    t.textContent = label.length > 12 ? label.slice(0, 11) + "…" : label;
    svg.appendChild(t);
  });

  return svg;
}

/* ---- line: change over time. Labels only the endpoint. ---- */
function lineSvg(spec, showTip, hideTip) {
  const n = spec.labels.length, series = spec.series;
  const width = 640, height = 250;
  const padL = 46, padR = 54, padT = 20, padB = 38;
  const plotW = width - padL - padR, plotH = height - padT - padB;
  const max = niceMax(Math.max(...series.flatMap(s => s.values.map(Math.abs)), 0));
  const svg = svgEl("svg", { viewBox: `0 0 ${width} ${height}`, role: "img" });

  [0, 0.5, 1].forEach(f => {
    const y = padT + plotH - f * plotH;
    svg.appendChild(svgEl("line", { x1: padL, y1: y, x2: width - padR, y2: y, class: "axis" }));
    const t = svgEl("text", { x: padL - 8, y: y + 3.5, "text-anchor": "end", class: "tick" });
    t.textContent = fmtNum(max * f);
    svg.appendChild(t);
  });

  const xAt = (i) => padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
  const yAt = (v) => padT + plotH - (Math.abs(v) / max) * plotH;

  series.forEach((se, k) => {
    const color = CHART_COLORS[k % CHART_COLORS.length];
    const d = se.values.map((v, i) => `${i ? "L" : "M"}${xAt(i)},${yAt(v)}`).join(" ");
    svg.appendChild(svgEl("path", {
      d, fill: "none", stroke: color, "stroke-width": 2,
      "stroke-linejoin": "round", "stroke-linecap": "round",
    }));

    se.values.forEach((v, i) => {
      // 2px surface ring so markers stay legible where they overlap.
      svg.appendChild(svgEl("circle", {
        cx: xAt(i), cy: yAt(v), r: 4, fill: color,
        stroke: SURFACE, "stroke-width": 2,
      }));
      const hit = svgEl("circle", { cx: xAt(i), cy: yAt(v), r: 12, class: "hit" });
      hit.addEventListener("mousemove", e =>
        showTip(e, `${spec.labels[i]} · ${se.name} ${fmtVal(v, spec.value_suffix)}`));
      hit.addEventListener("mouseleave", hideTip);
      svg.appendChild(hit);
    });

    const last = se.values.length - 1;
    const lab = svgEl("text", { x: xAt(last) + 10, y: yAt(se.values[last]) + 3.5, class: "val" });
    lab.textContent = fmtVal(se.values[last], spec.value_suffix);
    svg.appendChild(lab);
  });

  spec.labels.forEach((label, i) => {
    if (n > 8 && i % 2) return;
    const t = svgEl("text", { x: xAt(i), y: height - padB + 18,
                              "text-anchor": "middle", class: "cat" });
    t.textContent = label.length > 10 ? label.slice(0, 9) + "…" : label;
    svg.appendChild(t);
  });

  return svg;
}

/* ---- donut: share of one whole ---- */
function donutSvg(spec, showTip, hideTip) {
  const values = spec.series[0].values;
  const total = values.reduce((a, b) => a + b, 0) || 1;
  const size = 260, cx = 130, cy = 130, rOuter = 100, rInner = 62;
  const svg = svgEl("svg", { viewBox: `0 0 ${size + 300} ${size}`, role: "img" });

  let angle = -Math.PI / 2;
  const GAP = 0.016;   // the 2px surface gap, in radians at this radius

  values.forEach((v, i) => {
    const frac = v / total;
    const a0 = angle + GAP / 2, a1 = angle + frac * Math.PI * 2 - GAP / 2;
    angle += frac * Math.PI * 2;
    if (a1 <= a0) return;

    const large = a1 - a0 > Math.PI ? 1 : 0;
    const p = (r, a) => `${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`;
    const d = `M${p(rOuter, a0)} A${rOuter},${rOuter} 0 ${large} 1 ${p(rOuter, a1)}`
            + ` L${p(rInner, a1)} A${rInner},${rInner} 0 ${large} 0 ${p(rInner, a0)} Z`;

    const seg = svgEl("path", { d, fill: CHART_COLORS[i % CHART_COLORS.length] });
    seg.addEventListener("mousemove", e => showTip(e,
      `${spec.labels[i]} · ${fmtVal(v, spec.value_suffix)} (${(frac * 100).toFixed(1)}%)`));
    seg.addEventListener("mouseleave", hideTip);
    svg.appendChild(seg);
  });

  // Direct labels beside the ring rather than on the slices — a label that
  // does not fit inside a segment is never clipped.
  values.forEach((v, i) => {
    const y = 26 + i * 22;
    svg.appendChild(svgEl("rect", {
      x: size + 6, y: y - 9, width: 10, height: 10, rx: 2,
      fill: CHART_COLORS[i % CHART_COLORS.length],
    }));
    const t = svgEl("text", { x: size + 24, y, class: "cat" });
    t.textContent = `${spec.labels[i]} — ${fmtVal(v, spec.value_suffix)}`
                    + ` (${((v / total) * 100).toFixed(1)}%)`;
    svg.appendChild(t);
  });

  return svg;
}

function toast(text, bad = false) {
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.textContent = text;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add("show"));
  setTimeout(() => {
    t.classList.remove("show");
    setTimeout(() => t.remove(), 400);
  }, 4200);
}

/* ------------------------------------------------------------------
   Making the stream visible.

   The transport genuinely streams — measured in the browser, 250 tokens
   across 147 distinct arrival times. The problem is perceptual: a short
   answer's tokens land inside ~20ms, which is faster than anyone can see,
   so a real stream rendered raw looks exactly like a blob.

   So text is drained at a readable pace rather than painted the instant it
   arrives. The rate is adaptive: it clears whatever is queued within about
   a second, so a long answer never lags behind the network — this slows
   the *first* characters into view, never the last.
   ------------------------------------------------------------------ */
const TYPE_FLOOR = 55;      // characters per second, minimum
const CATCH_UP   = 0.9;     // seconds allowed to clear a backlog

class Typer {
  constructor(el) {
    this.el = el; this.queue = ""; this.shown = "";
    this.ended = false; this.last = null; this.raf = null; this.onDone = null;
    Typer.active = this;
  }
  push(text) { this.queue += text; this.kick(); }
  end(cb) { this.ended = true; this.onDone = cb; this.kick(); }
  flush() {                       // error, or the user moved on
    this.shown += this.queue; this.queue = "";
    this.paint(false); this.settle();
  }
  kick() {
    if (this.raf !== null) return;

    // [claude] requestAnimationFrame does not fire in a hidden tab.
    //
    // Found the hard way: with the tab backgrounded the typer stalled
    // completely — no text, and because `settle()` runs from inside a
    // frame, the completion callback never fired either, so the finished
    // answer and its details were never rendered at all. Someone who
    // switched tabs mid-answer came back to an empty bubble and a timer
    // still counting.
    //
    // Nobody is watching a hidden tab animate, so there is nothing to pace:
    // paint the lot and settle.
    if (document.hidden) { this.flush(); return; }

    this.raf = requestAnimationFrame(t => this.tick(t));
  }
  tick(now) {
    this.raf = null;
    const dt = this.last === null ? 1 / 60 : Math.min((now - this.last) / 1000, 0.25);
    this.last = now;

    if (this.queue.length) {
      const rate = Math.max(TYPE_FLOOR, this.queue.length / CATCH_UP);
      const take = Math.max(1, Math.round(rate * dt));
      this.shown += this.queue.slice(0, take);
      this.queue = this.queue.slice(take);
      this.paint(true);
    }
    if (this.queue.length) this.kick();
    else if (this.ended) { this.paint(false); this.settle(); }
  }
  paint(caret) {
    this.el.textContent = this.shown;
    if (caret) this.el.appendChild(document.createElement("span")).className = "caret";
    scrollDown();
  }
  settle() {
    if (Typer.active === this) Typer.active = null;
    const cb = this.onDone; this.onDone = null;
    if (cb) cb(this.shown);
  }
}

// The typer for the turn in flight, so hiding the tab can finish it.
Typer.active = null;

document.addEventListener("visibilitychange", () => {
  if (document.hidden && Typer.active) Typer.active.flush();
});



/* The agent writes light markdown — bold, bullets, the occasional heading.
   Rendering it here rather than showing raw asterisks. Deliberately tiny and
   escape-first: the answer contains CRM data and, in a reconciliation, text
   that came out of a file somebody uploaded, so nothing is ever trusted as
   HTML. Only the four patterns the agent actually produces are handled. */
function mdEscape(t) {
  return t.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}
function renderMarkdown(text) {
  const lines = mdEscape(text).split("\n");
  let html = "", inList = false;

  const inline = (l) =>
    l.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
     .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s.,;:)]|$)/g, "$1<em>$2</em>")
     .replace(/`([^`]+)`/g, "<code>$1</code>");

  for (let raw of lines) {
    const bullet = raw.match(/^\s*[-*•]\s+(.*)$/);
    if (bullet) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += "<li>" + inline(bullet[1]) + "</li>";
      continue;
    }
    if (inList) { html += "</ul>"; inList = false; }
    if (!raw.trim()) { html += "<br>"; continue; }
    const h = raw.match(/^#{1,4}\s+(.*)$/);
    html += h ? "<h4>" + inline(h[1]) + "</h4>"
              : "<p>" + inline(raw) + "</p>";
  }
  if (inList) html += "</ul>";
  return html;
}

/* Highlight SQL keywords — gold, matching the brand's accent role. */
const KEYWORDS = /\b(SELECT|FROM|WHERE|GROUP BY|ORDER BY|LIMIT|JOIN|LEFT|INNER|ON|AND|OR|NOT|NULL|IS|AS|COUNT|SUM|AVG|MIN|MAX|FILTER|CAST|WITH|HAVING|DISTINCT|CASE|WHEN|THEN|ELSE|END|BETWEEN|IN|INTERVAL|CURRENT_DATE|DESC|ASC|EXISTS|NUMERIC|TRUE|FALSE)\b/gi;
function sqlHtml(sql) {
  const esc = sql.replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
  return esc.replace(KEYWORDS, m => `<span class="kw">${m}</span>`);
}

/* ---------------- a turn, streamed ---------------- */
async function send(preset) {
  const text = (preset ?? $("input").value).trim();
  if (!text || busy) return;
  if (!hasToken()) { flashToken(); return; }

  busy = true; $("send").disabled = true;
  $("input").value = ""; $("input").style.height = "auto";
  bubble("user", text);

  const el = bubble("agent", "");
  const body = el.querySelector(".bubble");

  // [claude] One calm line. No tool names, no route names, no jargon —
  // that is how the machine works rather than what was asked. It exists
  // only so the couple of seconds before text appears do not read as a
  // hang; everything technical waits for `attachDetails` afterwards.
  const stage = document.createElement("div");
  stage.className = "stage";
  stage.innerHTML = '<span class="orb"></span>'
                  + '<span class="stage-text">Thinking</span>'
                  + '<span class="elapsed">0.0s</span>';
  el.insertBefore(stage, body);

  const t0 = performance.now();
  const ticking = setInterval(() => {
    stage.querySelector(".elapsed").textContent =
      ((performance.now() - t0) / 1000).toFixed(1) + "s";
  }, 100);
  const setStage = (t) => { stage.querySelector(".stage-text").textContent = t; };
  const endStage = () => { clearInterval(ticking); stage.classList.add("gone"); };

  const typer = new Typer(body);
  let route = null, plan = [], tools = [], started = false, finished = null;

  try {
    const res = await fetch("/v1/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json", ...auth() },
      body: JSON.stringify({ message: text, ...(threadId ? { thread_id: threadId } : {}) }),
    });

    if (!res.ok) {
      let msg = res.status + " " + res.statusText;
      try { msg = (await res.json()).error.message; } catch {}
      endStage(); body.className = "bubble err"; body.textContent = msg;
      return;
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "", event = null;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();

      for (const line of lines) {
        if (line.startsWith("event:")) { event = line.slice(6).trim(); continue; }
        if (!line.startsWith("data:")) continue;
        let d; try { d = JSON.parse(line.slice(5).trim()); } catch { continue; }

        // route, plan and tool are recorded for the details panel and
        // deliberately change nothing on screen while the turn runs.
        if (event === "start") threadId = d.thread_id;
        else if (event === "plan") plan = d.specialists || [];
        else if (event === "route") route = d.route;
        else if (event === "tool") tools.push(d.name);

        else if (event === "token") {
          if (!started) { started = true; setStage("Writing"); }
          typer.push(d.text);
        }

        else if (event === "final") {
          finished = d;
          typer.end(() => {
            endStage();
            const answer = d.answer || typer.shown || "(no answer)";
            body.innerHTML = renderMarkdown(answer);
            attachDetails(el, {
              specialists: (d.specialists && d.specialists.length)
                ? d.specialists
                : (plan.length ? plan : (d.route || route ? [d.route || route] : [])),
              tools: d.tools_used && d.tools_used.length ? d.tools_used : tools,
              provenance: d.provenance,
              charts: d.charts,
              answer,
            });
            loadThreads();
          });
        }

        else if (event === "error") {
          typer.flush(); endStage();
          body.className = "bubble err";
          body.textContent = d.message + (d.request_id ? "  ·  " + d.request_id : "");
        }
      }
    }

    if (!finished) typer.end(() => endStage());

  } catch (e) {
    typer.flush(); endStage();
    body.className = "bubble err";
    body.textContent = "Could not reach the agent — is it running?  (" + e.message + ")";
  } finally {
    busy = false; $("send").disabled = false; $("input").focus();
  }
}

function flashToken() {
  const t = $("token");
  t.style.borderColor = "#CBA46E";
  t.focus();
  setTimeout(() => (t.style.borderColor = ""), 1400);
}

/* ---------------- threads ---------------- */
async function loadThreads() {
  if (!hasToken()) return;
  try {
    const r = await fetch("/v1/threads?limit=50", { headers: auth() });
    if (!r.ok) return;
    const rows = (await r.json()).conversations;
    $("threads").innerHTML = "";
    rows.forEach(c => {
      const d = document.createElement("div");
      d.className = "thread" + (c.thread_id === threadId ? " active" : "");
      d.innerHTML = `<span class="t"></span><span class="n">${c.turn_count}</span><span class="kill">×</span>`;
      d.querySelector(".t").textContent = c.title || c.thread_id;
      d.querySelector(".t").onclick = () => openThread(c.thread_id);
      d.querySelector(".kill").onclick = async (e) => {
        e.stopPropagation();
        await fetch("/v1/threads/" + encodeURIComponent(c.thread_id), { method: "DELETE", headers: auth() });
        if (c.thread_id === threadId) newChat();
        loadThreads();
      };
      $("threads").appendChild(d);
    });
  } catch {}
}
async function openThread(id) {
  const r = await fetch("/v1/threads/" + encodeURIComponent(id), { headers: auth() });
  if (!r.ok) return;
  const c = await r.json();
  threadId = id;
  $("log").querySelector(".wrap").innerHTML = "";
  c.messages.forEach(m => {
    const el = bubble(m.role === "user" ? "user" : "agent", m.content);
    // [claude] The SQL is stored per turn now, so a reopened conversation
    // is as checkable as a live one.
    if (m.role !== "user") {
      attachDetails(el, {
        specialists: [], tools: [],
        provenance: m.provenance, answer: m.content,
      });
    }
  });
  loadThreads();
}
function newChat() {
  threadId = null;
  $("log").querySelector(".wrap").innerHTML = "";
  renderEmpty();
  loadThreads();
}
function renderEmpty() {
  const w = $("log").querySelector(".wrap");
  w.innerHTML = `<div class="empty" id="empty">
    <svg class="mark" width="34" height="100" viewBox="0 0 34 100" fill="none" stroke="#CBA46E" stroke-width="1">
      <path d="M17 1 C 24 26, 30 40, 33 50 C 30 60, 24 74, 17 99 C 10 74, 4 60, 1 50 C 4 40, 10 26, 17 1 Z"/>
      <path d="M17 1 L17 99"/><path d="M1 50 L33 50"/>
      <path d="M17 14 C 22 31, 26 42, 28 50 C 26 58, 22 69, 17 86 C 12 69, 8 58, 6 50 C 8 42, 12 31, 17 14 Z" opacity=".55"/>
    </svg>
    <div class="big">Live Inspired</div>
    <div class="lead">Live Connected · Live Inspired</div>
    <div class="suggest" id="suggest"></div></div>`;
  mountSuggestions();
}
function mountSuggestions() {
  const s = $("suggest");
  if (!s) return;
  s.innerHTML = "";
  SUGGESTIONS.forEach(q => {
    const b = document.createElement("button");
    b.textContent = q;
    b.onclick = () => send(q);
    s.appendChild(b);
  });
}

/* ---------------- files ---------------- */
async function loadFiles() {
  if (!hasToken()) return;
  try {
    const r = await fetch("/v1/workspace/files", { headers: auth() });
    if (!r.ok) return;
    const files = (await r.json()).files;
    $("files").innerHTML = "";
    files.forEach(f => {
      const shape = f.sheets?.length ? f.sheets[0].row_count + " rows"
                  : (f.page_count ? f.page_count + " pp" : "");
      const d = document.createElement("div");
      d.className = "file-row";
      d.innerHTML = `<span class="fn"></span><span class="meta">${shape}</span><span class="kill">×</span>`;
      d.querySelector(".fn").textContent = f.filename;
      d.querySelector(".kill").onclick = async () => {
        await fetch("/v1/workspace/files/" + f.file_id, { method: "DELETE", headers: auth() });
        loadFiles();
      };
      $("files").appendChild(d);
    });
  } catch {}
}
async function upload(file) {
  if (!file) return;
  if (!hasToken()) { flashToken(); return; }
  const drop = $("drop");
  const original = drop.innerHTML;
  drop.innerHTML = '<span class="spin">◇</span><br>uploading…';
  const fd = new FormData();
  fd.append("file", file);
  try {
    const r = await fetch("/v1/workspace/files", { method: "POST", headers: auth(), body: fd });
    const d = await r.json();
    if (!r.ok) toast(d.error?.message || "Upload failed", true);
    else toast(d.warnings?.length ? d.warnings.join(" · ") : "File uploaded.");
  } catch (e) {
    toast("Upload failed: " + e.message, true);
  } finally {
    drop.innerHTML = original; loadFiles();
  }
}
$("drop").onclick = () => $("file").click();
$("file").onchange = (e) => { upload(e.target.files[0]); e.target.value = ""; };
["dragenter", "dragover"].forEach(ev =>
  $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach(ev =>
  $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", e => upload(e.dataTransfer.files[0]));

/* ---------------- health ---------------- */
async function health() {
  try {
    const r = await fetch("/health/ready");
    const d = await r.json();
    $("health").className = "dot " + (d.ready ? "ok" : "bad");
    $("healthText").textContent = d.ready ? "ready" : "degraded";
    $("status").title = Object.entries(d)
      .filter(([, v]) => v && typeof v === "object")
      .map(([k, v]) => `${k}: ${v.ok ? "ok" : "FAIL"}${v.detail ? " — " + v.detail : ""}`)
      .join("\n");
  } catch {
    $("health").className = "dot bad";
    $("healthText").textContent = "offline";
  }
}

function refreshAll() { health(); loadThreads(); loadFiles(); }

$("send").onclick = () => send();
$("new").onclick = newChat;
$("refresh").onclick = refreshAll;
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("input").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 170) + "px";
});

mountSuggestions();
refreshAll();
setInterval(health, 15000);
</script>
</body>
