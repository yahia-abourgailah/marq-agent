<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The MarQ · Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<a class="skip" href="#input">Skip to the composer</a>

<!-- [claude] Announcements for a screen reader, and only announcements.
     The answer streams a character at a time; piping that into a live
     region would read the same sentence dozens of times over. So state
     changes are spoken here — asking, answering, done, failed — and the
     answer itself is read from the log when it has settled. -->
<div class="sr-only" id="announce" role="status" aria-live="polite"></div>

<div class="scrim" id="scrim" hidden></div>

<aside id="sidebar">
  <!-- [claude] Restructured. The brand block used to take 380px before
       anything functional, a raw password field sat in the most prominent
       position, and the lower half was dead space. Now: mark, primary
       action, conversations filling the height, files below, and identity
       in the footer where setup belongs. -->
  <div class="brand">
    <svg width="15" height="44" viewBox="0 0 34 100" fill="none" stroke="#CBA46E"
         stroke-width="1.6" aria-hidden="true">
      <path d="M17 1 C 24 26, 30 40, 33 50 C 30 60, 24 74, 17 99 C 10 74, 4 60, 1 50 C 4 40, 10 26, 17 1 Z"/>
      <path d="M17 1 L17 99"/><path d="M1 50 L33 50"/>
    </svg>
    <div class="wordmark">MARQ</div>
    <div class="sub">Communities</div>
  </div>

  <div class="lead-action">
    <button class="primary" id="new">
      <span aria-hidden="true">+</span> New conversation
    </button>
  </div>

  <div class="section-head">
    <span class="label">Conversations</span>
    <button class="icon" id="refresh" title="Refresh" aria-label="Refresh">⟳</button>
  </div>
  <div class="threads" id="threads"></div>

  <div class="files-block">
    <div class="section-head">
      <span class="label">Files</span>
      <span class="count" id="fileCount"></span>
    </div>
    <div class="drop" id="drop" tabindex="0" role="button"
         aria-label="Upload a file">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.2" aria-hidden="true">
        <path d="M12 16V4m0 0L8 8m4-4 4 4"/>
        <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
      </svg>
      <span>Drop a file <em>or click</em></span>
    </div>
    <input id="file" type="file" accept=".xlsx,.xlsm,.csv,.tsv,.pdf" hidden>
    <div id="files"></div>
  </div>

  <!-- Identity, not credentials. Who you are signed in as, with the token
       behind a click — it is setup, used once, not a daily control. -->
  <div class="identity">
    <button class="who-btn" id="whoBtn">
      <span class="avatar" id="avatar">—</span>
      <span class="whoami">
        <span class="name" id="whoName">Not signed in</span>
        <span class="hint" id="whoHint">Add an access token</span>
      </span>
      <span class="chev" aria-hidden="true">▸</span>
    </button>
    <div class="token-edit" id="tokenEdit">
      <input id="token" type="password" placeholder="Paste a bearer token"
             autocomplete="off" aria-label="Access token">
      <!-- [claude] Which of these two shows depends on where the token came
           from. Configured in the environment, there is nothing to do here
           and a password field saying "paste a bearer token" reads as a
           chore that is still outstanding. -->
      <code class="mono" id="tokenHelp">python scripts/dev_token.py mint</code>
    </div>
    <div class="tagline">Live Inspired</div>
  </div>
</aside>

<main>
  <header class="bar">
    <div class="bar-left">
      <button class="menu-btn" id="menu" aria-label="Show conversations and files"
              aria-expanded="false" aria-controls="sidebar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
             aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
      <div class="title">Agent</div>
    </div>
    <div class="status" id="status">
      <span class="dot" id="health"></span>
      <span class="label" id="healthText">checking</span>
    </div>
  </header>

  <button class="jump" id="jump" hidden>
    <span aria-hidden="true">↓</span> Latest
  </button>

  <div class="log" id="log" role="log" aria-label="Conversation">
    <div class="wrap"><div class="empty" id="empty">
      <svg class="mark" width="34" height="100" viewBox="0 0 34 100" fill="none"
           stroke="#CBA46E" stroke-width="1">
        <path d="M17 1 C 24 26, 30 40, 33 50 C 30 60, 24 74, 17 99 C 10 74, 4 60, 1 50 C 4 40, 10 26, 17 1 Z"/>
        <path d="M17 1 L17 99"/><path d="M1 50 L33 50"/>
        <path d="M17 14 C 22 31, 26 42, 28 50 C 26 58, 22 69, 17 86 C 12 69, 8 58, 6 50 C 8 42, 12 31, 17 14 Z" opacity=".55"/>
      </svg>
      <div class="big">Live Inspired</div>
      <div class="lead">Live Connected · Live Inspired</div>
      <div class="suggest" id="suggest"></div>
    </div></div>
  </div>

  <div class="composer">
    <div class="wrap">
      <textarea id="input" rows="1" aria-label="Ask a question"
                aria-describedby="composerHint"
                placeholder="Ask about deals, leads, or a file you uploaded…"></textarea>
      <button class="send" id="send">Send</button>
    </div>
    <div class="foot" id="composerHint">
      Enter to send · Shift + Enter for a new line · ⌘K for commands
    </div>
  </div>
</main>

<!-- [claude] The command palette. Hidden until ⌘K, and the only place
     every action in this console shares one address — which is what makes
     the drawer layout usable without a pointer. -->
<div class="palette-wrap" id="paletteWrap" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Commands">
    <div class="palette-head">
      <span class="gem" aria-hidden="true">◇</span>
      <input id="paletteInput" type="text" placeholder="Search commands and conversations…"
             autocomplete="off" spellcheck="false" role="combobox"
             aria-expanded="true" aria-controls="paletteList" aria-autocomplete="list">
      <span class="esc">Esc</span>
    </div>
    <div class="palette-list" id="paletteList" role="listbox" aria-label="Results"></div>
  </div>
</div>

<!-- Motion 13.1.1 (formerly Framer Motion), MIT, served from this host
     rather than a CDN — see static/vendor/README.md for why. -->
<script src="/vendor/motion.min.js"></script>
<!-- [claude] Runtime configuration, served only outside production. In
     production this 404s and `window.MARQ_DEV_TOKEN` stays undefined,
     which is the same as not being configured. -->
<script src="/app-config.js"></script>
<script src="/app.js"></script>
</body>
</html>
