# [claude] Lint and the hermetic test suite, on every push and pull request.
#
# Open across seven review passes before this landed, and the reason it kept
# slipping is that it looks like it needs infrastructure. It does not. The
# suite is already split: `pytest` runs the hermetic half by default —
# `addopts = "-m 'not integration'"` in pyproject.toml — and that half talks
# to no database, no model endpoint and no vector store.
#
# What is deliberately NOT here
# -----------------------------
# The integration suite and the five eval suites. They need a live vLLM
# endpoint and PostgreSQL, and the model endpoint is genuinely
# non-deterministic — docs/HANDOFF.md records counting failures across runs
# rather than re-running until green. A gate that fails a correct change
# because a sampled answer landed differently teaches people to ignore the
# gate, which is worse than not having one.
#
# Those run on a machine that can reach the endpoint. This runs on every
# push and is expected to be green every time.

name: CI

on:
  push:
  pull_request:

# A second push to the same branch cancels the first. Nothing here is worth
# finishing for a commit that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the interpreter this is developed against. Ruff targets
          # py311 for *syntax*, which is a different question — see
          # [tool.ruff] target-version in pyproject.toml.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # sentence-transformers pulls torch, which is most of this
          # install. It is imported lazily (see app/workspace/embeddings.py)
          # so the hermetic suite never loads it — but the project declares
          # it, and a CI that installs something other than what the project
          # declares is testing a different program.
          pip install -r requirements.txt

      - name: Config
        run: |
          # Settings are constructed at import, so the suite needs an env
          # file to exist before collection. The checked-in template plus
          # placeholders for the three values whose *constructors* validate
          # them — the hermetic tests build a model client and a token
          # verifier, and never call out with either.
          cp .env.development.example .env.development
          {
            echo "MODEL_NAME=ci-placeholder"
            echo "MODEL_BASE_URL=http://127.0.0.1:9/v1"
            echo "MODEL_API_KEY=ci-placeholder"
          } >> .env.development

      - name: Lint
        run: ruff check .

      - name: Tests
        # -m "not integration" is already the default from pyproject.toml;
        # stated here so a reader of the workflow can see what runs without
        # having to go and look.
        run: pytest -m "not integration" -q
