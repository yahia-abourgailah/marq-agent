# [claude] Added. The project had no tooling configuration at all, so pytest
# behaviour, async mode and line length were whatever each contributor's
# machine defaulted to. Dependencies stay in requirements.txt; this file
# carries tool configuration only, so nothing about how the app is installed
# or run changes.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# The suite uses explicit @pytest.mark.asyncio markers.
asyncio_mode = "strict"

# [claude] One event loop for the whole session.
#
# `app_db` is a module-level singleton whose pool opens lazily on first use,
# binding its internal futures to whichever loop got there first. With a loop
# per test, the next async test to touch the database failed with
# "The future belongs to a different loop". A shared loop keeps the pool
# valid across tests.
#
# The real fix is injecting the database rather than importing a singleton;
# this keeps the suite honest until then.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

markers = [
    "integration: needs a live model endpoint and/or a live database",
]

# [claude] Integration tests are excluded by default.
#
# Four test modules call get_model() or app_db.connect() and therefore need
# the vLLM endpoint and Postgres to be up. They were indistinguishable from
# unit tests, so a green run proved nothing about which parts were actually
# exercised, and the suite could not run in CI.
#
#   pytest                    unit tests only, hermetic
#   pytest -m integration     the live ones
#   pytest -m ""              everything
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 88
target-version = "py311"
# [claude] `.claude/` holds vendored third-party skill code — someone
# else's Python, pinned as shipped. Reformatting it to this repo's rules
# would only make the next update a merge conflict, and its style is not
# evidence about anything here.
extend-exclude = ["tests/fixtures", ".claude"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
